<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaDeep | Bio-Intelligence Core</title>
    <style>
        :root {
            --bg-deep: #0f172a;
            --bg-card: #1e293b;
            --genomic-green: #10b981;
            --text-main: #f8fafc;
            --border: #334155;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .terminal {
            width: 100%;
            max-width: 800px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
        }

        .header {
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-light {
            width: 10px;
            height: 10px;
            background: var(--genomic-green);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px var(--genomic-green);
        }

        h1 {
            font-size: 1.2rem;
            color: var(--genomic-green);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: #020617;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--genomic-green);
            padding: 15px;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
            resize: none;
        }

        textarea:focus {
            border-color: var(--genomic-green);
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            background: var(--genomic-green);
            color: var(--bg-deep);
            border: none;
            border-radius: 6px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .output-container {
            margin-top: 30px;
            padding: 20px;
            background: rgba(16, 185, 129, 0.05);
            border-left: 4px solid var(--genomic-green);
            display: none; /* Hidden by default */
        }

        .loader {
            display: none;
            text-align: center;
            margin-top: 15px;
            color: var(--genomic-green);
        }

        /* Animation for loading */
        .dots::after {
            content: '.';
            animation: dots 1.5s steps(5, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60% { content: '...'; }
            80%, 100% { content: ''; }
        }
    </style>
</head>
<body>

    <div class="terminal">
        <div class="header">
            <h1>Bio-Intelligence Terminal v3</h1>
            <div>
                <span class="status-light"></span>
                <span style="font-size: 0.7rem; color: #94a3b8; margin-left: 5px;">CORE ACTIVE</span>
            </div>
        </div>

        <label for="dnaInput">Input DNA Sequence (ACTG)</label>
        <textarea id="dnaInput" placeholder="> Enter sequence..."></textarea>

        <button id="analyzeBtn" onclick="sendSequence()">Run Optimization Engine</button>

        <div id="loader" class="loader">
            Analyzing Nucleotide Chains<span class="dots"></span>
        </div>

        <div id="outputArea" class="output-container">
            <label>Analysis Output</label>
            <div id="resultsContent" style="color: #cbd5e1; line-height: 1.6;">
                </div>
        </div>
    </div>

    <script>
        async function sendSequence() {
    const sequence = document.getElementById('dnaInput').value;

    // Updated to match your specific endpoint
    const backendUrl = 'http://127.0.0.1:8000/analyze1';

    try {
        const response = await fetch(backendUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sequence: sequence })
        });

        if (!response.ok) {
            throw new Error(`Server responded with status: ${response.status}`);
        }

        const data = await response.json();
        console.log("Response from Core:", data);

        // Update your UI with the data
    } catch (error) {
        console.error("Connection Failed:", error);
    }
}
    </script>
</body>
</html>
