version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: synapse_qdrant
    ports:
      - "6333:6333" # The HTTP API port used by the client
      - "6334:6334" # The GRPC port (optional, but good to have)
    volumes:
      - ./qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__ENABLE_TLS=false
    restart: always

  # Optional: A simple dashboard visualization service could go here later
  # For now, Qdrant has a built-in UI at http://localhost:6333/dashboard