<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Synapse</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="bg-gray-50 text-slate-800 flex flex-col min-h-screen">

    <nav class="sticky top-0 z-50 bg-white/90 backdrop-blur border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="{{ url_for('home') }}" class="flex items-center gap-3 group">
                <img src="{{ url_for('static', filename='synapse-logo.png') }}" alt="Logo" class="h-10 w-auto object-contain">
                <span class="text-xl font-bold tracking-tight text-slate-900">SYNAPSE</span>
            </a>
            <div class="hidden md:flex items-center gap-8 text-sm font-semibold text-slate-600">
                <a href="{{ url_for('home') }}" class="hover:text-blue-600">Home</a>
                <a href="{{ url_for('about') }}" class="hover:text-blue-600">About Us</a>
                <a href="{{ url_for('services') }}" class="hover:text-blue-600">Services</a>
                <a href="{{ url_for('contact') }}" class="text-blue-600">Contact</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow py-12 px-6">
        <div class="max-w-5xl mx-auto">
            <div class="text-center mb-12">
                <h1 class="text-3xl font-bold text-slate-900 mb-4">Get in Touch</h1>
                <p class="text-gray-600">We'd love to hear from you.</p>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-12">
                <div class="lg:col-span-5 space-y-8">
                    <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
                        <h3 class="font-bold text-slate-900 mb-4">Contact Info</h3>
                        <p class="text-sm text-gray-600 mb-2"><strong>Email:</strong> team@synapse.ai</p>
                        <p class="text-sm text-gray-600"><strong>Location:</strong> Tunis, Tunisia</p>
                    </div>
                </div>

                <div class="lg:col-span-7">
                    <form action="{{ url_for('send_message') }}" method="POST" class="bg-white p-8 rounded-xl border border-gray-200 shadow-sm">
                        
                        {% with messages = get_flashed_messages() %}
                          {% if messages %}
                            <div class="mb-6 p-4 bg-green-50 text-green-700 text-sm font-medium rounded-lg border border-green-200">
                              {{ messages[0] }}
                            </div>
                          {% endif %}
                        {% endwith %}

                        <div class="mb-6">
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Email</label>
                            <input type="email" name="email" required class="w-full bg-slate-50 border border-gray-200 rounded-lg p-3 outline-none">
                        </div>

                        <div class="mb-6">
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Message</label>
                            <textarea name="message" rows="4" required class="w-full bg-slate-50 border border-gray-200 rounded-lg p-3 outline-none resize-none"></textarea>
                        </div>

                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-lg">
                            Send Message
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-slate-900 text-white py-6 text-center text-xs text-slate-500">
        &copy; 2024 Synapse Project.
    </footer>
</body>
</html>
