<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synapse | Genomic Intelligence</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- External Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
    <script src="https://3dmol.org/build/3Dmol-min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="bg-gray-50 text-slate-800 flex flex-col min-h-screen">

    <!-- Navbar -->
    <nav class="sticky top-0 z-50 bg-white/90 backdrop-blur border-b border-gray-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            
            <!-- LOGO SECTION -->
            <a href="{{ url_for('home') }}" class="flex items-center gap-3 group">
                <img src="{{ url_for('static', filename='synapse-logo.png') }}" 
                     alt="Synapse Logo" 
                     class="h-10 w-auto object-contain group-hover:scale-105 transition-transform duration-200">
                <span class="text-xl font-bold tracking-tight text-slate-900">SYNAPSE</span>
            </a>

            <!-- NAVIGATION LINKS -->
            <div class="hidden md:flex items-center gap-8 text-sm font-semibold text-slate-600">
                <a href="{{ url_for('home') }}" class="text-blue-600">Home</a>
                <a href="{{ url_for('about') }}" class="hover:text-blue-600 transition-colors">About Us</a>
                <a href="{{ url_for('services') }}" class="hover:text-blue-600 transition-colors">Services</a>
                <a href="{{ url_for('contact') }}" class="hover:text-blue-600 transition-colors">Contact</a>
            </div>

            <!-- Status Badge -->
            <div class="hidden md:flex items-center gap-4">
                <div class="text-xs font-bold text-green-600 bg-green-50 px-3 py-1 rounded-full border border-green-200 flex items-center gap-2">
                    <span class="relative flex h-2 w-2">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                    </span>
                    System Online
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow py-10">
        <div class="max-w-7xl mx-auto px-6 grid grid-cols-1 lg:grid-cols-12 gap-8">
            <!-- LEFT: Input Section -->
            <div class="lg:col-span-5 flex flex-col gap-6">
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 relative overflow-hidden group">
                    <div class="absolute top-0 left-0 w-1 h-full bg-blue-600 transition-all group-hover:w-1.5"></div>
                    
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-sm font-bold text-slate-900 uppercase tracking-wide">Genomic Sequence Input</h2>
                        <span class="text-[10px] font-bold bg-gray-100 text-gray-500 px-2 py-1 rounded">FASTA Format</span>
                    </div>
                    
                    <form>
                        <textarea 
                            name="dna_sequence"
                            id="dna-input"
                            class="w-full h-40 bg-slate-50 border border-gray-200 rounded-lg p-3 font-mono text-sm text-slate-600 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none resize-none transition-all"
                            placeholder="> Paste DNA sequence (ATCG)..."
                            spellcheck="false"
                            hx-post="/analyze"
                            hx-trigger="keyup changed delay:1000ms"
                            hx-target="#results-wrapper"
                            hx-indicator="#loader"
                            hx-swap="innerHTML"
                        >ATGCGTACGTTAGCTAGCTAGCTATGCGTACGTTAGCTAGCTAGCT</textarea>

                        <div class="mt-4 flex justify-between items-center h-6">
                            <div id="loader" class="htmx-indicator text-blue-600 text-xs font-bold flex items-center gap-2">
                                <i class="fa-solid fa-circle-notch fa-spin"></i>
                                <span>ALIGNING VECTORS...</span>
                            </div>
                            <span class="text-xs text-gray-400" id="status-text">Ready for Inference</span>
                        </div>
                    </form>
                </div>
                <div id="results-wrapper">
                    <div class="bg-gray-100 rounded-xl p-8 border border-gray-200 text-center flex flex-col items-center justify-center h-48">
                        <i class="fa-solid fa-arrow-up text-gray-300 text-2xl mb-2"></i>
                        <p class="text-gray-400 text-sm">Enter sequence to begin analysis</p>
                    </div>
                </div>
            </div>

            <!-- RIGHT: Visualization Section -->
            <div class="lg:col-span-7 flex flex-col gap-6">
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col h-[450px]">
                    <div class="bg-slate-900 p-3 flex justify-between items-center text-white">
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-cube text-blue-400"></i>
                            <span class="text-xs font-bold tracking-wide">PROTEIN STRUCTURE PREDICTION</span>
                        </div>
                        <span class="bg-white/10 px-2 py-0.5 rounded text-[10px] font-mono">ID: 4HHB</span>
                    </div>
                    <div id="molecule-viewer" class="flex-grow bg-gray-50 relative"></div>
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4">
                    <h3 class="text-xs font-bold text-slate-900 mb-2">LATENT SPACE PROJECTION (T-SNE)</h3>
                    <div id="plotly-chart" class="w-full h-32"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-white pt-10 pb-6 border-t border-slate-800 mt-12">
        <div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center">
            <div class="flex items-center gap-2 mb-4 md:mb-0">
                <i class="fa-solid fa-dna text-blue-500"></i>
                <span class="font-bold tracking-tight">SYNAPSE</span>
            </div>
            
            <p class="text-xs text-slate-500">
                &copy; <span id="current-year"></span> Synapse Project. Built for InstaDeep Hackathon.
            </p>
        </div>
    </footer>

    <!-- Custom Logic -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    
    <!-- Dynamic Year & Interaction Locking -->
    <script>
        // 1. Dynamic Year Script
        document.getElementById('current-year').innerText = new Date().getFullYear();

        // 2. Interaction Locking
        document.body.addEventListener('htmx:beforeRequest', function(evt) {
            const area = document.getElementById('dna-input');
            const status = document.getElementById('status-text');
            area.disabled = true;
            area.classList.add('opacity-50', 'cursor-not-allowed');
            status.innerText = "Processing...";
        });

        document.body.addEventListener('htmx:afterRequest', function(evt) {
            const area = document.getElementById('dna-input');
            const status = document.getElementById('status-text');
            area.disabled = false;
            area.classList.remove('opacity-50', 'cursor-not-allowed');
            area.focus();
            status.innerText = "Analysis Complete";
        });
    </script>
</body>
</html>
