<div class="bg-white rounded-xl p-6 border border-blue-200 shadow-[0_4px_20px_rgba(37,99,235,0.1)] fade-in relative overflow-hidden h-48 flex flex-col justify-center">
    
    <div class="absolute top-0 right-0 w-24 h-24 bg-gradient-to-br from-blue-50 to-blue-100 rounded-bl-full -z-0"></div>

    <div class="relative z-10">
        <div class="flex justify-between items-start mb-3">
            <h3 class="text-xs font-bold text-gray-500 uppercase tracking-widest">Cosine Similarity Score</h3>
            <span class="bg-green-100 text-green-700 text-[10px] font-bold px-2 py-0.5 rounded-full border border-green-200 flex items-center gap-1">
                <i class="fa-solid fa-check-circle"></i> HIGH CONFIDENCE
            </span>
        </div>
        
        <div class="flex items-baseline gap-3 mb-4">
            <span class="text-5xl font-bold text-blue-600 tracking-tighter pulse-text">{{ molecule.score }}</span>
            <span class="text-sm font-semibold text-gray-400">/ 1.00</span>
        </div>
        
        <div class="pt-4 border-t border-gray-100 grid grid-cols-2 gap-4">
            <div>
                <div class="text-[10px] text-gray-400 uppercase">Matched Structure</div>
                <div class="text-sm font-bold text-slate-800">{{ molecule.name }}</div>
            </div>
            <div>
                <div class="text-[10px] text-gray-400 uppercase">Clinical Significance</div>
                <div class="text-sm font-bold text-green-600">{{ molecule.significance }}</div>
            </div>
        </div>
    </div>

    <textarea id="hidden-pdb-data" style="display:none;">{{ pdb_data|safe }}</textarea>

</div>
