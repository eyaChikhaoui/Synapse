<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Synapse</title>
    <!-- 1. Load HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <!-- 2. Link your new CSS file -->
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
</head>
<body>

<div class="terminal-container">
    <div class="status-tag">Connected to Synapse Core</div>
    <h1>Sequence Analysis Dashboard</h1>

    <div class="input-group">
        <label>Input DNA Sequence</label>
        <textarea name="dna_input" placeholder="Enter sequence..."></textarea>

        <button
            hx-post="/analyze"
            hx-target="#resultDestination"
            hx-indicator="#loading"
            hx-include="[name='dna_input']">
            Analyze
        </button>
        <div id="loading" class="htmx-indicator">Syncing with Core...</div>
    </div>

    <div id="resultDestination"></div>
</div>

</body>
</html>
