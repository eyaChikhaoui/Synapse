<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synapse | DNA-Protein AI</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="terminal-container">
    <div class="header-section">
        <div class="status-tag">Connected to Synapse Core</div>
        <h1 class="gradient-text">Sequence Analysis Dashboard</h1>
        <p class="subtitle">Translating life's code with high-performance AI.</p>
    </div>

    <div class="input-group">
        <label>Input DNA Sequence</label>
        <textarea name="dna_input" placeholder="ATGC..."></textarea>

        <button
            class="glow-button"
            hx-post="/analyze"
            hx-target="#resultDestination"
            hx-indicator="#loading"
            hx-include="[name='dna_input']">
            Run Analysis
        </button>

        <div id="loading" class="htmx-indicator">
            <span class="spinner"></span> Syncing with Core...
        </div>
    </div>

    <div id="resultDestination"></div>
</div>

</body>
</html>
