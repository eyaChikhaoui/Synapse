<div class="bg-white rounded-xl shadow-md border border-gray-100 overflow-hidden hover:shadow-lg transition-shadow duration-300">
    <div class="p-4 border-b border-gray-100 flex justify-between items-start {{ molecule.bg_class }}">
        <div>
            <h3 class="text-lg font-bold text-slate-800 leading-tight">{{ molecule.name }}</h3>
            <p class="text-xs text-slate-500 mt-1 uppercase tracking-wider font-semibold">Top Match from Vector Space</p>
        </div>
        <div class="text-right">
            <span class="block text-2xl font-black {{ molecule.color_class }}">{{ (molecule.score * 100)|round(1) }}%</span>
            <span class="text-[10px] text-gray-400 font-bold">SIMILARITY SCORE</span>
        </div>
    </div>

    <div class="p-4 bg-white">
        <div class="flex items-center gap-3 mb-3">
            <div class="p-2 rounded-lg {{ molecule.bg_class }}">
                <i class="fa-solid fa-microscope {{ molecule.color_class }}"></i>
            </div>
            <div>
                <p class="text-sm font-bold text-slate-700">Clinical Significance</p>
                <p class="text-sm {{ molecule.color_class }} font-medium">{{ molecule.significance }}</p>
            </div>
        </div>

        <div class="text-xs text-gray-400 mt-4 pt-4 border-t border-gray-100 flex justify-between">
            <span>Source: Qdrant Knowledge Base</span>
            <span>ID: PDB-{{ 1000 + (molecule.score * 1000)|int }}</span>
        </div>
    </div>
</div>

<textarea id="hidden-pdb-data" style="display:none;">{{ pdb_data | safe }}</textarea>
<textarea id="hidden-viz-data" style="display:none;">{{ viz_data | tojson | safe }}</textarea>
